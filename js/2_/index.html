<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Обратная связь</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1 class="title">Форма обратной связи</h1>
    <form id="feedbackForm" class="form">
      <label class="label">Тема
        <select id="topic" class="select">
          <option value="">— выберите —</option>
          <option value="thanks">Благодарность</option>
          <option value="review">Отзыв</option>
          <option value="complaint">Жалобу</option>
        </select>
      </label>

      <label class="label">Сообщение
        <textarea id="message" class="textarea">Текст сообщения…</textarea>
      </label>

      <div class="actions">
        <button type="button" id="resetBtn" class="btn ghost">Сброс</button>
        <button type="submit" class="btn primary">Отправить</button>
      </div>
    </form>
  </main>
  <script src="form.js"></script>
</body>
</html>
