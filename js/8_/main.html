<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Date</title>
	<link rel="stylesheet" href="styles.css">

</head>

<body>

	<div class="box">
		<div style="display: flex; flex-direction: column;">
			<h1>Часть 8. Объект Date в JavaScript</h1>
			<h3 style="margin: 10px 0px;text-align: center;">Вариант 0 . Определение разницы во времени</h4>
			<div class="input-box" style="display: flex; flex-direction: column;">
				<h3>Выберите дату : </h3>
				<form id="date-form" style="margin: 10px 0px;">
					<div class="date-form">
						<div class="container-form">
							<label for="day">День :</label>
							<input type="number" id="day" name="day" class="input-field">
						</div>
						<div class="container-form">
							<label for="month">Месяц:</label>
							<select id="month" name="month" class="input-field"></select>
							<!-- <input type="date" id="date2" name="date2" class="input-field"> -->
						</div>
						<div class="container-form">
							<label for="year">Год:</label>
							<input type="number" id="year" name="year" class="input-field">
						</div>
					</div>
					<button type="button" class="btn primary" id="calculate-btn">Вычислить</button>	
				</form>
				<div id="error"></div>
			</div>
		</div>

		<div class="result-box">

			</div>


		</div>

	</div>



	<script src="script.js"></script>

</body>

</html>
