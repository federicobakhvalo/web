<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Transform</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main class="catalog">
		<h1>3D Карточка товара</h1>

		<div class="scene">
			<div class="card" tabindex="0">
				<div class="card__inner">
					<div class="card__face card__front">
						<img src="https://i.pinimg.com/736x/47/32/02/47320273f905611dd4ac7d9d00e1f0df.jpg" alt="Product image">
						<div class="front-info">
							<h2>Deep Learning on Python</h2>
							<p class="price">₽1,999</p>
						</div>
					</div>
					<div class="card__face card__back">
						<h3>Описание</h3>
						<p>Короткое описание товара, характеристики и преимущества. Нажмите кнопку, чтобы купить.</p>
						<button class="buy">Купить</button>
					</div>
				</div>
			</div>
		</div>
	</main>
	
</body>
</html>
