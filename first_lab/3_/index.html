<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Transitions</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main class="demo">
		<h1>CSS Transitions — Демонстрация</h1>

		<section class="task">
			<h2>1. Кнопка с плавным переходом цвета (0.5s)</h2>
			<button class="btn btn-transition">Наведи меня</button>
		</section>

		<section class="task">
			<h2>2. Переход размеров (квадрат, 1s)</h2>
			<div class="square"></div>
		</section>

		<section class="task">
			<h2>3. Анимация движения (вправо 100px, 500ms)</h2>
			<div class="movable">Наведи меня</div>
		</section>

		<section class="task">
			<h2>4. Задержка перед началом перехода (300ms)</h2>
			<div class="delayed">Наведи на меня (с задержкой)</div>
		</section>
	</main>
	
</body>
</html>
