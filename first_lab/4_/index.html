<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Animation</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
		<main class="stage">
			<h1>Анимации — синхронизация и интерактивность</h1>

			<section class="scene" aria-hidden="false">
				<div class="shape square" id="s1" aria-label="square"></div>
				<div class="shape circle" id="s2" aria-label="circle"></div>
				<div class="shape triangle" id="s3" aria-label="triangle"></div>
				<div class="shape rect" id="s4" aria-label="rectangle"></div>
				<div class="shape diamond" id="s5" aria-label="diamond"></div>
			</section>

			<section class="interactive">
				<h2>Интерактивный элемент</h2>
				<div class="interactive-box" tabindex="0">Наведи / Кликни</div>
			</section>
		</main>
</body>
</html>
